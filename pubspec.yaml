name: catacroket
description: "Cata croquetas, guárdalas en tu libreta y compite con tu gente."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17

  # Estado
  flutter_riverpod: ^2.6.1

  # Navegación
  go_router: ^14.3.0

  # Mapa (OpenStreetMap, sin clave de API)
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

  # GPS, para poner el punto estando en el bar
  geolocator: ^14.0.3

  # Fotos y vídeo
  image_picker: ^1.1.2
  video_player: ^2.9.2

  # Almacenamiento local
  shared_preferences: ^2.3.2
  path_provider: ^2.1.5

  # Compartir la estampa de una cata
  share_plus: ^13.3.0

  # Abrir WhatsApp para invitar y compartir al momento
  url_launcher: ^6.3.2

  # Utilidades
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/icon/
    # El logo de la otra app. Aparte de assets/brand/, que es la nuestra.
    - assets/palito/

  fonts:
    - family: Fredoka
      fonts:
        - asset: fonts/Fredoka-Regular.ttf
          weight: 400
        - asset: fonts/Fredoka-Medium.ttf
          weight: 500
        - asset: fonts/Fredoka-SemiBold.ttf
          weight: 600
        - asset: fonts/Fredoka-Bold.ttf
          weight: 700
    - family: Nunito
      fonts:
        - asset: fonts/Nunito-Regular.ttf
          weight: 400
        - asset: fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: fonts/Nunito-Bold.ttf
          weight: 700
        - asset: fonts/Nunito-ExtraBold.ttf
          weight: 800
        - asset: fonts/Nunito-Black.ttf
          weight: 900

flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  ios: true
  android: true
  remove_alpha_ios: true
  android_adaptive_icon_background: "#FF5A5F"
  android_adaptive_icon_foreground: "assets/icon/app_icon.png"
