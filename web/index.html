<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catacroket</title>
<meta name="description" content="La app para catar croquetas con tu gente.">
<style>
  :root { --fondo:#FFF3DC; --papel:#FFF; --tinta:#2C1B4D; --suave:#70607B; --sol:#FFC93C; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fondo); color: var(--tinta);
    font: 17px/1.65 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  }
  main {
    max-width: 32rem; width: 100%; background: var(--papel);
    border: 3px solid var(--tinta); border-radius: 22px;
    box-shadow: 0 6px 0 var(--tinta); padding: clamp(28px, 6vw, 48px); text-align: center;
  }
  .marca {
    display:inline-block; background: var(--sol); border: 3px solid var(--tinta);
    border-radius: 999px; padding: 4px 16px; font-weight: 800; font-size: 14px;
    letter-spacing: .08em; text-transform: uppercase;
  }
  h1 { font-size: clamp(30px, 7vw, 42px); line-height: 1.1; margin: 16px 0 8px; }
  p.lema { color: var(--suave); margin: 0 0 28px; }
  a.enlace {
    display: block; background: var(--papel); border: 3px solid var(--tinta);
    border-radius: 14px; box-shadow: 0 4px 0 var(--tinta); padding: 14px 20px;
    font-weight: 800; text-decoration: none; color: var(--tinta); margin: 12px 0;
  }
  footer { margin-top: 28px; color: var(--suave); font-size: 14px; }
  footer a { color: var(--suave); }
</style>
</head>
<body>
<main>
  <span class="marca">Catacroket</span>
  <h1>Cata croquetas con tu gente</h1>
  <p class="lema">Apunta la croqueta, ponle nota y compártela con tu mesa.</p>

  <a class="enlace" href="privacidad.html">Política de privacidad</a>
  <a class="enlace" href="soporte.html">Soporte</a>

  <footer>
    <p><a href="mailto:escalartica@gmail.com?subject=Catacroket">escalartica@gmail.com</a></p>
  </footer>
</main>
</body>
</html>
